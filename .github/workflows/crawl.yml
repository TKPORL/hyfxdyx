name: Sync Source Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # 每15分钟检测源站更新；数据有变化才提交和发布
  workflow_dispatch: {} # 允许在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 爬取游戏卡片（自动同步新增与删除）
        run: python scripts/crawl.py

      - name: 检测数据是否变化
        id: changed
        run: |
          count=$(git status --porcelain | wc -l)
          if [ "${{ github.event_name }}" = "push" ]; then count=$((count+1)); fi
          echo "changed=$count" >> "$GITHUB_OUTPUT"
          echo "本次需要发布的变更标记: $count"

      - name: 提交并推送更新
        if: steps.changed.outputs.changed != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交（仍会发布最新代码）"
          else
            git commit -m "chore: 同步源站更新 $(date -u '+%F %T')"
            git push
          fi

      - name: 上传 Pages 构件
        if: steps.changed.outputs.changed != '0'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.changed != '0'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
