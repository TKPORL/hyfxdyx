name: Daily Crawl

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = 北京时间每天早上 9:00
  workflow_dispatch: {} # 允许在 Actions 页面手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-crawl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 爬取游戏卡片
        run: python scripts/crawl.py

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有新变化，跳过提交"
          else
            git commit -m "chore: 每日爬取更新 $(date -u +%F)"
            git push
          fi

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
