<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏详情 - Tsinho黄油站</title>
<meta name="description" content="Tsinho黄油站单游戏详情页：游戏介绍、发布时间、网盘下载地址与相关推荐。">
<link rel="canonical" id="canonical" href="https://tkporl.github.io/hyfxdyx/">
<link rel="icon" href="https://tsinho.us.ci/file/1790008576207_80AE7775A1BFBF55701C9E76FBD31274.webp" type="image/webp">
<link rel="apple-touch-icon" href="https://tsinho.us.ci/file/1790008576207_80AE7775A1BFBF55701C9E76FBD31274.webp">
<!-- 评论样式来自主站 site.css 的 .mrhx-comments 全套（comments.js 只建 DOM 不带样式） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/TKPORL/mrhyfx@main/assets/css/site.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{background:#faf9f7;color:#2b2b2b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
img{display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
main{max-width:900px;margin:0 auto;padding:22px 20px 44px}
.crumbs{font-size:12.5px;color:#999;margin-bottom:16px}
.crumbs a:hover{color:#e5484d}
.detail{display:grid;grid-template-columns:280px minmax(0,1fr);gap:30px;background:#fff;border:1px solid #ecebe9;border-radius:16px;padding:26px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.d-cover{width:100%;height:auto;object-fit:contain;border-radius:12px;background:#f4f2ef}
.d-title{font-size:21px;font-weight:800;line-height:1.45}
.badges{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;font-weight:600;border-radius:8px;padding:4px 11px}
.badge.plat{background:#fdf1f1;color:#e5484d;border:1px solid #f0b4b6}
.badge.time{background:#f1efe9;color:#888}
.like-row{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.like-btn{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:#555;background:#fff;border:1px solid #ecebe9;border-radius:10px;padding:9px 18px;transition:.18s}
.like-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.like-btn:hover{color:#e5484d;border-color:#f0b4b6;background:#fdf3f3}
.like-btn.liked{color:#e5484d;background:#fdf3f3;border-color:#f0b4b6}
.like-btn.liked svg{fill:#e5484d;stroke:#e5484d;animation:pop .35s cubic-bezier(.2,2,.4,1)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.seen{font-size:13px;color:#999}
.dl-title{font-size:13px;font-weight:700;color:#888;letter-spacing:2px;margin-bottom:10px}
.dl-btns{display:flex;gap:10px;flex-wrap:wrap}
.dl-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:.2s}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.dl-btn.primary{background:#e5484d;color:#fff;border:1px solid #e5484d}
.dl-btn.primary:hover{background:#c93a3f}
.dl-btn.alt{background:#fff;color:#444;border:1px solid #e2ded8}
.dl-btn.alt:hover{color:#e5484d;border-color:#f0b4b6}
.dl-btn svg{width:15px;height:15px;stroke:currentColor}
.dl-note{margin-top:12px;font-size:12.5px;color:#999;line-height:1.7}
.intro{margin-top:24px;padding-top:22px;border-top:1px dashed #ecebe9}
.intro h3,.rel h3{font-size:15.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.intro h3::before,.rel h3::before{content:'';width:4px;height:15px;border-radius:2px;background:#e5484d}
.intro .txt{font-size:14px;color:#444;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.rel{margin-top:28px}
.rel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px}
.rcard{background:#fff;border:1px solid #ecebe9;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.2s;display:block}
.rcard:hover{border-color:#f0b4b6;transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.08)}
.rcard .c{position:relative;aspect-ratio:16/9;overflow:hidden;background:#f4f2ef}
.rcard .c img{width:100%;height:100%;object-fit:cover;object-position:top}
.rcard .p{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:600;color:#fff;background:rgba(43,43,43,.72);border-radius:6px;padding:2px 7px}
.rcard .i{padding:10px 12px 12px;border-top:1px solid #ecebe9}
.rcard .t{font-size:13.5px;font-weight:600;line-height:1.5;height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard:hover .t{color:#e5484d}
.rcard .m{margin-top:6px;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#999}
.rcard .m b{color:#e5484d}
.empty-tip{text-align:center;color:#999;padding:60px 0;font-size:14px}
footer{border-top:1px solid #ecebe9;padding:22px 20px;text-align:center;color:#999;font-size:12px}
footer a{color:#e5484d;text-decoration:none}
.loading{text-align:center;color:#999;padding:80px 0;font-size:14px}
@media (max-width:720px){
  main{padding:16px 14px 32px}
  .detail{grid-template-columns:1fr;padding:18px;gap:20px}
  .d-cover{max-width:260px}
}
</style>
</head>
<body>
<header><div id="siteNav"></div></header>
<main>
  <div class="crumbs"><a href="index.html">首页</a> / <span id="crumb">…</span></div>
  <div id="box" class="loading">加载中…</div>
  <section class="rel" id="relSec" style="display:none">
    <h3>相关推荐</h3>
    <div class="rel-grid" id="rel"></div>
  </section>
</main>
<footer>数据自动同步自 <a href="https://tkporl.github.io/mrhyfx/" target="_blank" rel="noreferrer">Tsinho黄油站</a> · 本站仅供学习交流，请于下载后 24 小时内删除，支持正版</footer>
<script src="assets/js/nav.js?v=20261008c"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function views(id) { var h = 0, s = String(id); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return 900 + h % 6100; }
  function fmtV(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n); }
  function relTime(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d.getTime())) return '';
    var diff = Math.floor((Date.now() - d.getTime()) / 864e5);
    if (diff <= 0) return '今天'; if (diff === 1) return '昨天';
    if (diff < 30) return diff + ' 天前';
    return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate();
  }
  function fullTime(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d.getTime())) return '';
    return '发布于 ' + d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  var id = new URLSearchParams(location.search).get('id') || '';
  var G = null;

  // ===== 真数据：复用主站同一套 Supabase（公开 anon key，与主站页面明文一致） =====
  var SB = 'https://kydmccknlbpczeqppbtc.supabase.co';
  var KEY = 'sb_publishable_OfNqFNohTdrmzZ8dtu5bZQ_LcTk5iF9';
  var PAGE_KEY = '/hyfxdyx/game.html?id=' + id; // 浏览量/评论的存储键
  function sbGet(q) {
    // 偶发网络抖动自动重试 1 次（Supabase 偶发连接重置，主站有前科）
    return fetch(SB + q, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } })
      .catch(function () { return fetch(SB + q, { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }); })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function sbRpc(fn, body) {
    var opts = {
      method: 'POST',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {})
    };
    return fetch(SB + '/rest/v1/rpc/' + fn, opts)
      .catch(function () { return fetch(SB + '/rest/v1/rpc/' + fn, opts); })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  // 浏览量：读（1 次请求）+ 写（每访客每天每页只 1 次请求，localStorage 去重）
  function loadViews() {
    sbGet('/rest/v1/page_views?select=count&url=eq.' + encodeURIComponent(PAGE_KEY))
      .then(function (rows) {
        var c = (rows && rows[0] && rows[0].count) || 0;
        var el = $('#seenTxt'); if (el) el.textContent = fmtV(c) + ' 人看过这个页面';
      })
      .catch(function () { var el = $('#seenTxt'); if (el) el.textContent = ''; });
    try {
      var k = 'hyfx_pv_' + id, today = new Date().toDateString();
      if (localStorage.getItem(k) !== today) {
        localStorage.setItem(k, today);
        sbRpc('inc_page_view', { p_url: PAGE_KEY }).catch(function () {});
      }
    } catch (e) {}
  }
  // 点赞：读（1 次请求）；点击走 RPC 只 +1（防刷：已赞后本浏览器禁点）
  function loadLikes() {
    sbGet('/rest/v1/game_likes?select=count&game_id=eq.' + encodeURIComponent(id))
      .then(function (rows) {
        base = (rows && rows[0] && rows[0].count) || 0;
        renderLike();
      })
      .catch(function () { base = 0; renderLike(); });
  }

  function renderLike() {
    var liked = false;
    try { liked = localStorage.getItem('hyfx_like_' + id) === '1'; } catch (e) {}
    var b = $('#likeBtn'); if (!b) return;
    b.classList.toggle('liked', liked);
    b.disabled = liked; // 真数据只 +1：已赞后禁点，防止重复计数
    // base 即库中当前总数：点击后由 RPC 返回的新值直接写入，不再 +1（修「点一次显示 +2」的展示 bug）
    $('#likeTxt').textContent = liked ? '已赞 ' + base : '点赞 ' + base;
  }
  var base = 0;

  function render(d) {
    var games = d.games || [];
    var g = null;
    for (var i = 0; i < games.length; i++) { if (games[i].id === id) { g = games[i]; break; } }
    if (!g) { $('#box').className = 'empty-tip'; $('#box').textContent = '没有找到这个游戏，可能已被移除。'; $('#crumb').textContent = '未找到'; return; }
    G = g;
    document.title = g.name + ' - Tsinho黄油站';
    $('#crumb').textContent = g.name;
    var can = document.getElementById('canonical');
    if (can) can.href = 'https://tkporl.github.io/hyfxdyx/game.html?id=' + encodeURIComponent(g.id);

    var dl = (g.links || []).map(function (l, i) {
      return '<a class="dl-btn ' + (i === 0 ? 'primary' : 'alt') + '" href="' + esc(l.url) + '" target="_blank" rel="noreferrer">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>' +
        esc(l.label || '下载地址') + '</a>';
    }).join('') || '<span style="color:#999;font-size:14px">暂无下载链接</span>';

    base = 0;
    var h = '<section class="detail"><img class="d-cover" src="' + esc(g.cover) + '" alt="' + esc(g.name) + '">' +
      '<div><h1 class="d-title">' + esc(g.name) + '</h1>' +
      '<div class="badges"><span class="badge plat">' + esc(g.platform || '') + '</span>' +
      (g.time ? '<span class="badge time">' + esc(fullTime(g.time)) + '</span>' : '') + '</div>' +
      '<div class="like-row"><button type="button" class="like-btn" id="likeBtn">' +
      '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-10-9.3C.6 8.6 2.6 5 6.2 5c2.2 0 3.7 1.2 4.6 2.6h2.4C14.1 6.2 15.6 5 17.8 5c3.6 0 5.6 3.6 4.2 6.7C19.5 16.3 12 21 12 21z"/></svg>' +
      '<span id="likeTxt">点赞 …</span></button><span class="seen" id="seenTxt">…</span></div>' +
      '<div class="dl-title">下载地址</div><div class="dl-btns">' + dl + '</div>' +
      '<p class="dl-note">链接自动同步自主站每日分享，若失效请到求助贴留言。安卓游戏请先看解压教程再安装。</p>' +
      '<div class="intro"><h3>游戏介绍</h3><div class="txt">' + esc(g.desc || '暂无介绍。') + '</div></div></div></section>';
    $('#box').className = '';
    $('#box').outerHTML = h.replace('id="box"', '');

    renderLike();
    loadViews();
    loadLikes();
    $('#likeBtn').addEventListener('click', function () {
      var liked = false;
      try { liked = localStorage.getItem('hyfx_like_' + id) === '1'; } catch (e) {}
      if (liked) return; // 真数据只 +1，已赞后禁点防重复计数
      var btn = $('#likeBtn');
      btn.disabled = true;
      $('#likeTxt').textContent = '点赞中…';
      sbRpc('inc_game_like', { p_id: id })
        .then(function (c) {
          base = Number(c) || base + 1;
          try { localStorage.setItem('hyfx_like_' + id, '1'); } catch (e) {}
          renderLike();
        })
        .catch(function () {
          btn.disabled = false;
          $('#likeTxt').textContent = '点赞失败，请重试';
        });
    });

    // 评论区：复用主站同一套 Supabase comments 表 + 评论脚本（自带样式，挂哪显示哪）
    var cmtHost = document.createElement('div');
    cmtHost.style.marginTop = '28px';
    $('.detail').insertAdjacentElement('afterend', cmtHost);
    window.MRHXC = { sb: SB, key: KEY, path: PAGE_KEY, fold: 6 };
    var cs = document.createElement('script');
    cs.src = 'https://cdn.jsdelivr.net/gh/TKPORL/mrhyfx@main/assets/js/comments.js';
    cmtHost.appendChild(cs);

    // 相关推荐：同帖优先，不足补同平台
    var rel = games.filter(function (x) { return x.id !== g.id && x.post === g.post; });
    if (rel.length < 6) rel = rel.concat(games.filter(function (x) { return x.id !== g.id && x.platform === g.platform && rel.indexOf(x) === -1; }));
    rel = rel.slice(0, 12);
    if (rel.length) {
      $('#relSec').style.display = '';
      $('#rel').innerHTML = rel.map(function (x) {
        return '<a class="rcard" href="game.html?id=' + encodeURIComponent(x.id) + '">' +
          '<div class="c"><img loading="lazy" src="' + esc(x.cover) + '" alt="' + esc(x.name) + '"><span class="p">' + esc(x.platform || '') + '</span></div>' +
          '<div class="i"><div class="t">' + esc(x.name) + '</div>' +
          '<div class="m"><span>' + relTime(x.time) + '</span><span class="rv" data-id="' + esc(x.id) + '"></span></div></div></a>';
      }).join('');
      // 相关卡浏览量：1 次批量查询（in 过滤），不逐卡发请求
      var keys = rel.map(function (x) { return '"/hyfxdyx/game.html?id=' + x.id + '"'; });
      sbGet('/rest/v1/page_views?select=url,count&url=in.(' + keys.join(',') + ')')
        .then(function (rows) {
          var map = {};
          (rows || []).forEach(function (r) { map[r.url] = r.count; });
          document.querySelectorAll('.rv').forEach(function (el) {
            var k = '/hyfxdyx/game.html?id=' + el.getAttribute('data-id');
            var c = map[k] || 0;
            el.innerHTML = '<b>' + fmtV(c) + '</b> 人看过';
          });
        })
        .catch(function () {});
    }
  }

  fetch('data/games.slim.json', { cache: 'no-cache' })
    .then(function (r) { return r.json(); })
    .then(render)
    .catch(function () { $('#box').className = 'empty-tip'; $('#box').textContent = '数据加载失败，请稍后刷新重试。'; });
})();
</script>
</body>
</html>
